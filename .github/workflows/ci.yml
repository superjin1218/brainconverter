name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade 'pip>=26.2,<27'
      - run: pip install -r requirements-dev.txt
      - run: ruff check backend scripts/deploy_openai.py
      - run: docker pull postgres:16-alpine
      - run: pytest -q
        env:
          RUN_SQL_TESTS: "1"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Check browser modules
        run: |
          for js_file in backend/app/static/js/*.js; do
            node --input-type=module --check < "$js_file"
          done
      - run: node --test backend/tests/frontend_state.test.mjs
